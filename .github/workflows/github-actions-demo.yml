name: GitHub Actions Demo

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '15 6 * * 0'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - Test
          - Load-Test
          - Production
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Print triggering event
        run: |
          echo "🎉 The job was triggered by event: ${{ github.event_name }}"
          # For pull_request events the branch name is in GITHUB_HEAD_REF.
          # For push/schedule/workflow_dispatch it's in GITHUB_REF (refs/heads/<branch>).
          if [ -n "${GITHUB_HEAD_REF}" ]; then
            BRANCH="${GITHUB_HEAD_REF}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "🔎 Branch: $BRANCH"

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: List files in the repository
        run: |
          echo "Repository ${{ github.repository }} contains:"
          # Prefer `tree` if available for a nice view, otherwise fall back to find.
          if command -v tree >/dev/null 2>&1; then
            tree -a
          else
            find . -maxdepth 3 -type d -print -o -type f -print | sed 's|^\./||'
          fi
  Test:
    name: Test
    needs: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: Test

    steps:
      - name: Run tests
        run: echo "Testing..."
        
  Load-Test:
    name: Load-Test
    needs: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: Load-Test

    steps:
      - name: Run tests
        run: |
          echo "Load Testing..."
          sleep 15
          
  Production:
    name: Production
    needs:
      - Test
      - Load-Test
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'Production'

    environment:
      name: Production
      url: https://writeabout.net

    steps:
      - name: Deployment Step 1
        run: |
          echo "Step 1 deploying..."
          sleep 10

      - name: Deployment Step 2
        run: |
          echo "Step 2 deploying..."
          sleep 10

      - name: Deployment Step 3
        run: |
          echo "Step 3 deploying..."
          sleep 10

      - name: Deployment Step 4
        run: |
          echo "Step 4 deploying..."
          sleep 10

      - name: Deployment Step 5
        run: |
          echo "Step 5 deploying..."
          sleep 10
